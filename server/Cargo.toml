[package]
name = "server"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/media"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
imagesize = { version = "0.15.0", default-features = false, features = ["bmp", "gif", "jxl", "tiff", "webp"] }
infer = "0.22.0"
libc = "0.2.191"
memchr = "2.8.3"
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }
