[package]
name = "media"
version = "0.1.0"
edition = "2024"

[dependencies]
dav1d = "0.11.1"
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
imagesize = { version = "0.15.0", default-features = false, features = ["bmp", "gif", "jxl", "tiff", "webp"] }
infer = "0.22.0"
jpeg-decoder = "0.3.2"
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }
libc = "0.2.191"
memchr = "2.8.3"
mime_guess = "2.0.5"
rav1e = { version = "0.8.1", default-features = false, features = ["asm", "threading"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"] }
yuvutils-rs = "0.8.3"
