[package]
name = "crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11.0"
fpe = "0.7"
getrandom = { version = "0.4.3", features = ["std"] }
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
