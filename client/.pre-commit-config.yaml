default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        language: system
        entry: npx --no -- oxfmt --no-error-on-unmatched-pattern
        types_or: [javascript, ts, tsx, json, css, html, markdown, yaml]

      - id: oxlint
        name: oxlint
        language: system
        entry: npx --no -- oxlint --deny-warnings
        types_or: [javascript, ts, tsx]
